<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/Clixxo_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clixxo</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          if (localStorage.getItem("clixxo-theme") === "dark") {
            document.body.classList.add("dark");
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
